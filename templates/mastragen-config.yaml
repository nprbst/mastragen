# Mastragen Project Configuration
# Copy this file to your project: .mastragen/config.yaml
# Documentation: https://github.com/nprbst/mastragen/blob/main/docs/config-file.md

version: "1"

components:
  # Phoenix observability - AI trace collection and experiment tracking
  phoenix:
    enabled: true  # Set to false to disable Phoenix

    # Data retention settings (optional - defaults shown)
    # retention:
    #   traces_days: 30       # Days to keep trace data
    #   experiments_days: 90  # Days to keep experiment data

  # Astro UI sandbox - live preview of your Astro frontend
  # astro:
  #   enabled: false
  #   path: ./ui  # Path to your Astro project (relative to repo root)

# Custom paths (optional)
# paths:
#   mastra: ./src/mastra    # Path to Mastra directory
#   workspace: /workspace   # Custom workspace mount point
