# T084: RBAC configuration for orchestrator
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mastragen.fullname" . }}-orchestrator
  labels:
    {{- include "mastragen.orchestrator.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mastragen.fullname" . }}-orchestrator
  labels:
    {{- include "mastragen.orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mastragen.fullname" . }}-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "mastragen.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# ClusterRole for accessing metrics API (cluster-scoped resource)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mastragen.fullname" . }}-metrics-reader
  labels:
    {{- include "mastragen.orchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mastragen.fullname" . }}-metrics-reader
  labels:
    {{- include "mastragen.orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mastragen.fullname" . }}-metrics-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "mastragen.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
