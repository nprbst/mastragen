{{- if and .Values.secrets.github.appId .Values.secrets.github.privateKey (not .Values.secrets.github.existingSecret) }}
# T083: Secrets reference template
# This template creates secrets only when inline values are provided
# For production, use existingSecret references instead
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mastragen.fullname" . }}-github
  labels:
    {{- include "mastragen.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_APP_ID: {{ .Values.secrets.github.appId | quote }}
  GITHUB_PRIVATE_KEY: |
    {{- .Values.secrets.github.privateKey | nindent 4 }}
  {{- if .Values.secrets.github.webhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.github.webhookSecret | quote }}
  {{- end }}
{{- end }}
{{/*
Note: For Tailscale auth key, create a secret manually:
kubectl create secret generic tailscale-auth --from-literal=key=tskey-auth-xxxxx

Or reference an existing secret in values.yaml:
tailscale:
  authKeySecretName: my-tailscale-secret
  authKeySecretKey: auth-key
*/}}
