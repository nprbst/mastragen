# T095e: Orchestrator Caddyfile ConfigMap
# Provides HTTPS termination via Tailscale certificates
{{- if and .Values.tailscale.enabled .Values.caddy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mastragen.fullname" . }}-caddy-config
  labels:
    {{- include "mastragen.orchestrator.labels" . | nindent 4 }}
data:
  Caddyfile: |
    # Tailscale HTTPS configuration for Mastragen orchestrator
    # Hostname format: mastragen-{env}.{tailnet}.ts.net

    {
      # Enable Tailscale TLS certificate provisioning
      tailscale {
        # Use socket at /var/run/tailscale/tailscaled.sock
      }
    }

    # Main HTTPS endpoint
    https://mastragen-{{ .Values.global.environment }}.{{ .Values.tailscale.tailnet }}.ts.net {
      tls {
        get_certificate tailscale
      }

      # Reverse proxy to orchestrator
      reverse_proxy localhost:4000 {
        # Pass through original host header
        header_up Host {upstream_hostport}

        # Health check configuration
        health_uri /health
        health_interval 10s
        health_timeout 5s
      }

      # Logging
      log {
        output stdout
        format json
      }
    }

    # Metrics endpoint (optional, internal only)
    :2019 {
      metrics /metrics
    }
{{- end }}
