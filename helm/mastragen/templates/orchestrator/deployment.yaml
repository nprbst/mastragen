# T078: Orchestrator deployment
# T085-T086: Liveness and readiness probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mastragen.fullname" . }}-orchestrator
  labels:
    {{- include "mastragen.orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  {{- with .Values.orchestrator.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mastragen.orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.orchestrator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mastragen.orchestrator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.orchestrator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mastragen.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.orchestrator.terminationGracePeriodSeconds | default 10 }}
      securityContext:
        {{- toYaml .Values.orchestrator.podSecurityContext | nindent 8 }}
      containers:
        - name: orchestrator
          securityContext:
            {{- toYaml .Values.orchestrator.securityContext | nindent 12 }}
          image: {{ include "mastragen.orchestrator.image" . }}
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: HOST
              value: "0.0.0.0"
            - name: MASTRAGEN_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MASTRAGEN_ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            {{- range $key, $value := .Values.orchestrator.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.tailscale.enabled }}
            - name: TAILSCALE_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.tailscale.apiSecretName }}
            - name: TAILSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tailscale.apiSecretName }}
                  key: api-key
                  optional: true
            - name: TAILSCALE_TAILNET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tailscale.apiSecretName }}
                  key: tailnet
                  optional: true
            {{- end }}
          {{- with .Values.orchestrator.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.orchestrator.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.orchestrator.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.orchestrator.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orchestrator.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.orchestrator.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.orchestrator.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.orchestrator.probes.liveness.successThreshold }}
          {{- end }}
          {{- if .Values.orchestrator.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.orchestrator.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.orchestrator.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orchestrator.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.orchestrator.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.orchestrator.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.orchestrator.probes.readiness.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.orchestrator.persistence.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
        {{- if .Values.tailscale.enabled }}
        # Tailscale sidecar for private networking
        - name: tailscale
          image: {{ include "mastragen.tailscale.image" . }}
          imagePullPolicy: {{ .Values.tailscale.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tailscale.authKeySecretName }}
                  key: {{ .Values.tailscale.authKeySecretKey }}
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "false"
            - name: TS_HOSTNAME
              value: {{ printf "mastragen-%s" .Values.global.environment | quote }}
            {{- if .Values.caddy.enabled }}
            # T095d: Allow Caddy to fetch TLS certificates from Tailscale
            - name: TS_PERMIT_CERT_UID
              value: "1000"  # Must match Caddy's runAsUser
            # Put socket directly in shared volume (not a symlink to /tmp)
            - name: TS_SOCKET
              value: "/var/run/tailscale/tailscaled.sock"
            {{- end }}
            {{- if .Values.tailscale.aclTags }}
            - name: TS_EXTRA_ARGS
              value: {{ printf "--advertise-tags=%s" (join "," .Values.tailscale.aclTags) | quote }}
            {{- end }}
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            {{- if .Values.caddy.enabled }}
            - name: tailscale-socket
              mountPath: /var/run/tailscale
            {{- end }}
          resources:
            {{- toYaml .Values.tailscale.resources | nindent 12 }}
        {{- end }}
        {{- if and .Values.tailscale.enabled .Values.caddy.enabled }}
        # T095c: Caddy sidecar for HTTPS termination via Tailscale
        - name: caddy
          image: {{ include "mastragen.caddy.image" . }}
          imagePullPolicy: {{ .Values.caddy.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: tailscale-socket
              mountPath: /var/run/tailscale
              readOnly: true
            - name: caddy-data
              mountPath: /data/caddy
            - name: caddy-config-data
              mountPath: /config/caddy
          resources:
            {{- toYaml .Values.caddy.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- if .Values.orchestrator.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mastragen.fullname" . }}-data
        {{- end }}
        {{- if .Values.tailscale.enabled }}
        - name: tailscale-state
          emptyDir: {}
        {{- end }}
        {{- if and .Values.tailscale.enabled .Values.caddy.enabled }}
        - name: tailscale-socket
          emptyDir: {}
        - name: caddy-config
          configMap:
            name: {{ include "mastragen.fullname" . }}-caddy-config
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config-data
          emptyDir: {}
        {{- end }}
      {{- with .Values.orchestrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
