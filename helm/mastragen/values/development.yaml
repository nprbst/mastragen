# T087: Development environment values
# Usage: helm install mastragen ./helm/mastragen -f ./helm/mastragen/values/development.yaml

orchestrator:
  replicaCount: 1

  image:
    pullPolicy: Always

  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

  env:
    LOG_LEVEL: "debug"
    NODE_ENV: "development"
    K8S_SKIP_TLS_VERIFY: "true"  # Allow metrics API with self-signed certs in minikube
    NODE_TLS_REJECT_UNAUTHORIZED: "0"  # Skip TLS verification for all HTTPS (dev only!)

  persistence:
    enabled: true
    size: 1Gi

# Enable Tailscale for development
tailscale:
  enabled: true
  authKeySecretName: mastragen-tailscale
  authKeySecretKey: auth-key
  apiSecretName: mastragen-tailscale
  aclTags: []  # No ACL tags for local dev

# Disable RBAC for local development (minikube admin access)
rbac:
  create: true

# Disable PDB for single replica
podDisruptionBudget:
  enabled: false
