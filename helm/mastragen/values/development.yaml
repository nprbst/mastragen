# T087: Development environment values
# Usage: helm install mastragen ./helm/mastragen -f ./helm/mastragen/values/development.yaml

# Temporary: use dev2 to bypass LE rate limit on "dev" (revert after Jan 26)
global:
  environment: "dev2"

orchestrator:
  replicaCount: 1

  image:
    repository: mastragen-orchestrator
    tag: local
    pullPolicy: Never

  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

  env:
    LOG_LEVEL: "debug"
    NODE_ENV: "development"
    K8S_SKIP_TLS_VERIFY: "true"  # Allow metrics API with self-signed certs in minikube
    NODE_TLS_REJECT_UNAUTHORIZED: "0"  # Skip TLS verification for all HTTPS (dev only!)
    # Sandbox image configuration for local minikube
    IMAGE_REGISTRY: "mastragen"  # Local image prefix (no registry)
    IMAGE_TAG: "local"
    IMAGE_PULL_POLICY: "Never"  # Use locally built images

  persistence:
    enabled: true
    size: 1Gi

# Enable Tailscale for development
tailscale:
  enabled: true
  tailnet: "shad-smelt"  # Your tailnet domain
  authKeySecretName: mastragen-tailscale
  authKeySecretKey: auth-key
  apiSecretName: mastragen-tailscale
  aclTags: []  # No ACL tags for local dev

# Local Caddy image for development
caddy:
  enabled: true
  image:
    repository: mastragen-caddy
    tag: local
    pullPolicy: Never

# Disable RBAC for local development (minikube admin access)
rbac:
  create: true

# Disable PDB for single replica
podDisruptionBudget:
  enabled: false
