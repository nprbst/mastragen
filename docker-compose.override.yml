# Local development overrides
# This file is automatically loaded by docker compose

services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.dev
    volumes:
      - ./orchestrator/src:/app/src:ro
      - ./data:/app/data
      - ./web/dist:/web/dist:ro
    environment:
      - NODE_ENV=development
      - WEB_DIST_PATH=/web/dist

  cui:
    volumes:
      - ./fixtures/test-project:/workspace
    profiles:
      - dev

  mastra:
    volumes:
      - ./fixtures/test-project:/workspace
    profiles:
      - dev

  astro:
    volumes:
      - ./fixtures/test-project:/workspace
    profiles:
      - dev

  code-server:
    volumes:
      - ./fixtures/test-project:/workspace
    profiles:
      - dev
