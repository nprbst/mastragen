networks:
  mastragen:
    name: mastragen
    driver: bridge

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_PATH=/app/data/mastragen.db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ORCHESTRATOR_URL=http://orchestrator:4000
      # GitHub App OAuth
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:4000/api/auth/callback}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - mastragen
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mastra:
    build:
      context: ./sandbox
      dockerfile: mastra/Dockerfile
    ports:
      - "4111:4111"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PHOENIX_ENABLED=${PHOENIX_ENABLED:-false}
      - PHOENIX_ENDPOINT=${PHOENIX_ENDPOINT:-http://phoenix:6006/v1/traces}
      - PHOENIX_PROJECT_NAME=${PHOENIX_PROJECT_NAME:-mastragen-experiments}
    networks:
      - mastragen
    depends_on:
      - orchestrator
    profiles:
      - sandbox

  astro:
    build:
      context: ./sandbox
      dockerfile: astro/Dockerfile
    ports:
      - "4321:4321"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - UI_SANDBOX_PATH=${UI_SANDBOX_PATH:-packages/ui}
      - MASTRA_API_URL=http://mastra:4111
    networks:
      - mastragen
    depends_on:
      - orchestrator
      - mastra
    profiles:
      - sandbox

  vscode:
    build:
      context: ./sandbox/code-server
    ports:
      - "8080:8080"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ASTRO_PREVIEW_URL=${ASTRO_PREVIEW_URL:-http://localhost:4321}
    networks:
      - mastragen
    depends_on:
      - orchestrator
    profiles:
      - sandbox

  chrome:
    image: ghcr.io/browserless/chromium:latest
    ports:
      - "9222:3000"
    environment:
      - CONNECTION_TIMEOUT=300000
      - MAX_CONCURRENT_SESSIONS=2
      - PREBOOT_CHROME=true
      - DEFAULT_LAUNCH_ARGS=["--disable-dev-shm-usage"]
    networks:
      - mastragen
    depends_on:
      - astro
    profiles:
      - sandbox
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  init:
    build:
      context: ./sandbox/init
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - BRANCH=${BRANCH}
      - UI_SANDBOX_PATH=${UI_SANDBOX_PATH}
    networks:
      - mastragen
    profiles:
      - sandbox

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix-data:/data/phoenix
    environment:
      - PHOENIX_SQL_DATABASE_URL=sqlite:////data/phoenix/phoenix.db
      - PHOENIX_WORKING_DIR=/data/phoenix
      - PHOENIX_TRACE_RETENTION_DAYS=30
    networks:
      - mastragen
    depends_on:
      - orchestrator
    profiles:
      - phoenix
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  workspace:
  phoenix-data:
