services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_PATH=/app/data/mastragen.db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mastra:
    build:
      context: ./sandbox
      dockerfile: mastra/Dockerfile
    ports:
      - "4111:4111"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - orchestrator
    profiles:
      - sandbox

  astro:
    build:
      context: ./sandbox
      dockerfile: astro/Dockerfile
    ports:
      - "4321:4321"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - UI_SANDBOX_PATH=${UI_SANDBOX_PATH:-packages/ui}
      - MASTRA_API_URL=http://mastra:4111
    depends_on:
      - orchestrator
      - mastra
    profiles:
      - sandbox

  vscode:
    build:
      context: ./sandbox/code-server
    ports:
      - "8080:8080"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ASTRO_PREVIEW_URL=${ASTRO_PREVIEW_URL:-http://localhost:4321}
    depends_on:
      - orchestrator
    profiles:
      - sandbox

  init:
    build:
      context: ./sandbox/init
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - BRANCH=${BRANCH}
      - UI_SANDBOX_PATH=${UI_SANDBOX_PATH}
    profiles:
      - sandbox

volumes:
  workspace:
