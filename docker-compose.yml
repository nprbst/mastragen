networks:
  mastragen:
    name: mastragen
    driver: bridge

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_PATH=/app/data/mastragen.db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ORCHESTRATOR_URL=http://orchestrator:3000
      # GitHub App OAuth
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - mastragen
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mastra:
    build:
      context: ./sandbox
      dockerfile: mastra/Dockerfile
    ports:
      - "4111:4111"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - mastragen
    depends_on:
      - orchestrator
    profiles:
      - sandbox

  astro:
    build:
      context: ./sandbox
      dockerfile: astro/Dockerfile
    ports:
      - "4321:4321"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - UI_SANDBOX_PATH=${UI_SANDBOX_PATH:-packages/ui}
      - MASTRA_API_URL=http://mastra:4111
    networks:
      - mastragen
    depends_on:
      - orchestrator
      - mastra
    profiles:
      - sandbox

  vscode:
    build:
      context: ./sandbox/code-server
    ports:
      - "8080:8080"
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ASTRO_PREVIEW_URL=${ASTRO_PREVIEW_URL:-http://localhost:4321}
      # Use Microsoft VS Code Marketplace for up-to-date extensions (Open VSX versions are outdated)
      - EXTENSIONS_GALLERY={"serviceUrl":"https://marketplace.visualstudio.com/_apis/public/gallery","cacheUrl":"https://vscode.blob.core.windows.net/gallery/index","itemUrl":"https://marketplace.visualstudio.com/items"}
    networks:
      - mastragen
    depends_on:
      - orchestrator
    profiles:
      - sandbox

  init:
    build:
      context: ./sandbox/init
    volumes:
      - workspace:/workspace
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - BRANCH=${BRANCH}
      - UI_SANDBOX_PATH=${UI_SANDBOX_PATH}
    networks:
      - mastragen
    profiles:
      - sandbox

volumes:
  workspace:
