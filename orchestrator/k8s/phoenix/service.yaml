apiVersion: v1
kind: Service
metadata:
  name: phoenix
  labels:
    app: phoenix
    component: observability
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6006
      targetPort: 6006
      protocol: TCP
    - name: otlp
      port: 4317
      targetPort: 4317
      protocol: TCP
  selector:
    app: phoenix
