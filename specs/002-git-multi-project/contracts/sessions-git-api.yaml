openapi: 3.0.0
info:
  title: Mastragen Sessions Git API
  description: Git-related session endpoints for Phase 2
  version: 2.0.0

paths:
  /sessions:
    post:
      summary: Create new session with git branch
      description: |
        Creates a new session for the specified project. Verifies user has write
        access to the repository, creates a git branch, and starts the sandbox
        containers.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionWithUrls'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User lacks write access to repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or environment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Session with this artifact name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}:
    get:
      summary: Get session details
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/suspend:
    post:
      summary: Suspend active session
      description: |
        Commits all workspace changes to the session branch, pushes to remote,
        and stops the sandbox containers. Session state changes to 'suspended'.
      operationId: suspendSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Session is not in 'active' state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Git operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/resume:
    post:
      summary: Resume suspended session
      description: |
        Clones the session branch (or checks out specific commit), starts
        sandbox containers, and restores cui session history from .cui/ directory.
        Session state changes to 'active'.
      operationId: resumeSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeSessionRequest'
      responses:
        '200':
          description: Session resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionWithUrls'
        '400':
          description: Session is not in 'suspended' or 'pr_open' state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Session is locked by another active pod
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Git operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{id}/pull-request:
    post:
      summary: Create pull request from session
      description: |
        If session is active, commits and pushes changes, then stops containers.
        Creates a GitHub pull request targeting the project's default branch.
        Session state changes directly to 'pr_open' (does not go through 'suspended').
      operationId: createPullRequest
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePullRequestRequest'
      responses:
        '201':
          description: Pull request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestResponse'
        '400':
          description: Session has no commits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pull request already exists for this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Session ID (6-character hex)
      schema:
        type: string
        pattern: '^[a-f0-9]{6}$'

  schemas:
    CreateSessionRequest:
      type: object
      required:
        - projectId
        - artifactName
        - environment
        - userId
      properties:
        projectId:
          type: string
          description: Project ID to create session in
          example: "abc123"
        artifactName:
          type: string
          description: User-defined name for the session/artifact
          pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
          minLength: 1
          maxLength: 50
          example: "billing-feature"
        environment:
          type: string
          description: Environment name (must exist in project)
          example: "development"
        userId:
          type: string
          description: User ID for branch naming
          pattern: '^[a-zA-Z0-9_-]+$'
          maxLength: 50
          example: "user123"

    ResumeSessionRequest:
      type: object
      properties:
        commitSha:
          type: string
          description: Specific commit SHA to resume from (optional, defaults to latest)
          pattern: '^[a-f0-9]{40}$'
          example: "a1b2c3d4e5f6789012345678901234567890abcd"

    CreatePullRequestRequest:
      type: object
      properties:
        title:
          type: string
          description: Custom PR title (optional, auto-generated if not provided)
          maxLength: 256
          example: "Add billing feature"
        description:
          type: string
          description: Custom PR description/body (optional)
          maxLength: 65536
          example: "This PR adds the billing feature with invoice generation."

    Session:
      type: object
      properties:
        id:
          type: string
          description: Session ID
          example: "a1b2c3"
        projectId:
          type: string
          description: Associated project ID
          example: "abc123"
        userId:
          type: string
          description: User ID
          example: "user123"
        artifactName:
          type: string
          description: Session artifact name
          example: "billing-feature"
        environment:
          type: string
          description: Environment name
          example: "development"
        state:
          type: string
          enum: [active, suspended, pr_open, closed]
          description: Current session state
          example: "active"
        branchName:
          type: string
          description: Git branch name
          example: "mg/user123/billing-feature-a1b2c3"
        lastCommitSha:
          type: string
          nullable: true
          description: Most recent commit SHA (null if no commits)
          example: "a1b2c3d4e5f6789012345678901234567890abcd"
        commitCount:
          type: integer
          description: Total number of commits on branch
          example: 5
        prNumber:
          type: integer
          nullable: true
          description: GitHub PR number (null if no PR)
          example: 42
        prUrl:
          type: string
          nullable: true
          description: GitHub PR URL (null if no PR)
          example: "https://github.com/org/repo/pull/42"
        createdAt:
          type: string
          format: date-time
          description: Session creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    SessionWithUrls:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            urls:
              $ref: '#/components/schemas/ServiceUrls'

    ServiceUrls:
      type: object
      properties:
        cui:
          type: string
          description: Tailscale URL to cui interface (port 3001)
          example: "https://session-a1b2c3.tailnet.ts.net:3001"
        mastra:
          type: string
          description: Tailscale URL to Mastra Studio (port 4111)
          example: "https://session-a1b2c3.tailnet.ts.net:4111"
        astro:
          type: string
          nullable: true
          description: Tailscale URL to Astro sandbox (port 4321, null if not configured)
          example: "https://session-a1b2c3.tailnet.ts.net:4321"
        vscode:
          type: string
          description: Tailscale URL to VS Code (port 8080)
          example: "https://session-a1b2c3.tailnet.ts.net:8080"

    PullRequestResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        pr:
          type: object
          properties:
            number:
              type: integer
              description: GitHub PR number
              example: 42
            url:
              type: string
              description: GitHub PR URL
              example: "https://github.com/org/repo/pull/42"
            title:
              type: string
              description: PR title
              example: "Add billing feature"
            state:
              type: string
              enum: [open, closed, merged]
              description: PR state
              example: "open"

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "SESSION_NOT_FOUND"
        message:
          type: string
          description: Human-readable error message
          example: "Session with ID 'xyz123' not found"
        issues:
          type: array
          description: Detailed validation issues (for 400 errors)
          items:
            type: object
            properties:
              path:
                type: string
                description: Field path
              message:
                type: string
                description: Issue description
